<form class="search" action="/search" method="get" role="search">
  <label class="visually-hidden" for="search-input">잃어버린 물건 설명</label>
  <input id="search-input" type="search" name="q" value="{{ q or '' }}" maxlength="100" required
         placeholder="예: 파란 텀블러, 고양이 스티커" enterkeyhint="search">
  <button class="btn btn-primary" type="submit">AI로 찾기</button>
</form>
